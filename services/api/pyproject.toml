[project]
name = "aurora-api"
version = "0.1.0"
description = "AURORA Lifeline API (FastAPI on Cloud Run)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aurora-agents",
    "aurora-engine",
    "fastapi>=0.115",
    "firebase-admin>=6.6",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
aurora-agents = { workspace = true }
aurora-engine = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aurora_api"
module-root = ""

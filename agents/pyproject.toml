[project]
name = "aurora-agents"
version = "0.1.0"
description = "Gemini agents for AURORA Lifeline (bulletin reader, field verifier, advisory writer)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk>=2.10,<3",
    "google-cloud-storage>=2.18",
    "google-genai>=2.25,<3.0.0",
    "pdfplumber>=0.11",
    "pillow>=10.4",
    "pydantic>=2.9",
    "shapely>=2.0",
    "xmlschema>=3.4",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aurora_agents"
module-root = ""

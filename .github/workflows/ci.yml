name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history, same pinned version as local)
        env:
          VERSION: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$VERSION
          curl -sSfLO "$base/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${VERSION}_checksums.txt" | grep linux_x64.tar.gz | sha256sum -c -
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner --verbose .

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy -p aurora_engine -p aurora_agents -p aurora_api -p aurora_pipelines
      - run: uv run --no-sync pytest

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Generated types match schemas/
        run: make schemas && git diff --exit-code -- engine/aurora_engine/contracts apps/web/src/contracts

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm --dir apps/web lint --max-warnings=0
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - name: generated run data (web-data branch)
        run: |
          git fetch --depth 1 origin web-data
          mkdir -p apps/web/public
          git archive --format=tar FETCH_HEAD runs | tar -xf - -C apps/web/public
      - run: pnpm --dir apps/web build

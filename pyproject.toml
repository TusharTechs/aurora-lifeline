[project]
name = "aurora-lifeline"
version = "0.1.0"
description = "AURORA Lifeline: cyclone lifeline-isolation forecasts from official IMD bulletins"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aurora-engine",
    "aurora-agents",
    "aurora-api",
    "aurora-pipelines",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine", "agents", "services/api", "pipelines"]

[tool.uv.sources]
aurora-engine = { workspace = true }
aurora-agents = { workspace = true }
aurora-api = { workspace = true }
aurora-pipelines = { workspace = true }

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.28",
    "hypothesis>=6.100",
    "jsonschema>=4.23",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
    "xmlschema>=3.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["agents/aurora_agents/contracts", "data", "apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "NPY"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["aurora_engine", "aurora_agents", "aurora_api", "aurora_pipelines"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "N802", "N806", "E501"]
"pipelines/**" = ["PLR0912", "PLR0914", "PLR0915"]
"pipelines/aurora_pipelines/validate_s1.py" = ["E501"]  # report field names and rule text
# Prompt text and Telugu/Hindi strings are content, not code.
"agents/aurora_agents/facts.py" = ["E501", "RUF001", "PLR0917"]
"agents/aurora_agents/advisory.py" = ["E501"]
"agents/aurora_agents/ask.py" = ["E501", "PLR0915"]
"agents/aurora_agents/bulletin_reader.py" = ["E501"]
"services/api/aurora_api/main.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = ["engine", "agents", "services/api", "pipelines"]
explicit_package_bases = true
exclude = ["^data/", "^apps/", "contracts/generated\\.py$"]

[[tool.mypy.overrides]]
module = [
    "geopandas.*", "shapely.*", "pyogrio.*", "rasterio.*", "h3.*", "rustworkx.*",
    "numba.*", "scipy.*", "eccodes.*", "pdbufr.*", "osmium.*", "osmnx.*", "networkx.*",
    "pdfplumber.*", "xmlschema.*", "ee.*", "google.cloud.*", "firebase_admin.*", "pyproj.*",
    "xarray.*", "jsonschema.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
